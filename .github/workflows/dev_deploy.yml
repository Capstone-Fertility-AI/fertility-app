name: CI/CD Deploy to AWS EC2

on:
  push:
    branches: [ "develop" ] # 배포할 브랜치 이름 (main이라면 main으로 변경)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub에서 코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. GitHub Secrets에 저장해둔 application.yml 파일을 프로젝트에 안전하게 주입
      - name: Inject application.yml
        env:
          YAML_SECRET: ${{ secrets.APPLICATION_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$YAML_SECRET" > src/main/resources/application-prod.yml

      # 4. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 프로젝트 빌드 (.jar 파일 생성)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. 생성된 .jar 파일을 EC2 서버로 전송 (SCP)
      - name: Send jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      # 7. EC2 서버에 접속해서 기존 서버를 끄고 새 파일로 다시 실행 (SSH)
      - name: Execute Deploy Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1) 기존 서버 종료 (영준님의 원래 방식이 정답이었습니다! 원복!)
            echo "기존 서버를 종료합니다."
            pkill -x java || true
            sleep 5
            
            # 2) 파일 이동 후 실행 준비
            cd /home/ubuntu/app
            JAR_NAME=$(ls -tr *.jar | tail -n 1)
            echo "배포할 파일: $JAR_NAME"
            
            # 3) 백그라운드 실행 (옵션 순서 수정 및 < /dev/null 유지)
            nohup java -Dspring.profiles.active=prod -jar $JAR_NAME > nohup.out 2>&1 < /dev/null &
            echo "서버 배포 스크립트 실행 완료!"
name: CI/CD Deploy to AWS EC2

on:
  push:
    branches: [ "develop" ] # 배포할 브랜치 이름 (main이라면 main으로 변경)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub에서 코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. GitHub Secrets에 저장해둔 application.yml 파일을 프로젝트에 안전하게 주입
      - name: Inject application.yml
        env:
          YAML_SECRET: ${{ secrets.APPLICATION_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$YAML_SECRET" > src/main/resources/application-prod.yml

      # 4. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 프로젝트 빌드 (.jar 파일 생성)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. 생성된 .jar 파일을 EC2 서버로 전송 (SCP)
      - name: Send jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      # 7. EC2 서버에 접속해서 기존 서버를 끄고 새 파일로 다시 실행 (SSH)
      - name: Execute Deploy Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1) 기존 서버 종료
            echo "기존 서버를 종료합니다."
            pkill -x java || true
            sleep 5
            
            # 2) 파일 이동 및 찌꺼기 정리 (⭐️ 핵심 수정 부분)
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            
            # 🚨 불필요한 plain.jar 삭제 (이게 있으면 실행 에러가 납니다)
            rm -f *plain.jar || true
            
            # 가장 최신 jar 파일 이름 찾기
            JAR_NAME=$(ls -tr *.jar | tail -n 1)
            echo "배포할 파일: $JAR_NAME"
            
            # 🚨 방어 코드: JAR_NAME이 비어있으면 배포 중단 (에러 원인 파악용)
            if [ -z "$JAR_NAME" ]; then
              echo "🚨 배포할 .jar 파일을 찾을 수 없습니다! SCP 전송 단계를 확인해주세요."
              exit 1
            fi
            
            # 3) 백그라운드 실행 (⭐️ 변수에 쌍따옴표 추가로 안전성 확보)
            nohup java -Dspring.profiles.active=prod -jar "$JAR_NAME" > nohup.out 2>&1 < /dev/null &
            echo "서버 배포 스크립트 실행 완료!"
server:
port: 8080

spring:
  config:
    activate:
      on-profile: local

  datasource:
    # 💡 PostgreSQL 설정 (기본 포트 5432, 로컬 DB 이름은 fertility_db로 가정)
    # 로컬에서 SSL 타임아웃 시 url 끝에 ?ssl=false 추가
    url: jdbc:postgresql://localhost:5432/fertility_db
    username: postgres # 로컬 PostgreSQL 기본 계정
    password: ${LOCAL_DB_PASSWORD:postgres} # .env에서 주입, 없으면 postgres 사용
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000 # 10초 (연결 대기 시간)

  jpa:
    hibernate:
      # 로컬에서는 엔티티 변경 시 자동으로 DB 테이블을 수정해주는 update 사용
      ddl-auto: update

jwt:
  # 로컬용 시크릿 키와 만료시간(1시간)
  secret: ${JWT_SECRET:local-jwt-secret-key-for-development-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

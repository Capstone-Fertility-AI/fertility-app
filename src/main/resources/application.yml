spring:
  application:
    name: fertility # 프로젝트 이름에 맞게 변경하세요
  profiles:
    active: local # 기본 실행 환경을 local로 지정

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # PostgreSQL 방언 설정 (버전에 따라 자동 인식되지만 명시해주는 것이 안전)
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: "((a, b) => a.get('operationId').localeCompare(b.get('operationId')))"

# 💡 구글, KIS 등 불필요한 것 제거, 카카오만 남김
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    redirect-uri: http://localhost:8080/oauth/kakao/callback
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    client-secret: ${KAKAO_CLIENT_SECRET}

jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  access-token-validity: 3600000      # 1시간 (밀리초 단위)
  refresh-token-validity: 604800000   # 7일
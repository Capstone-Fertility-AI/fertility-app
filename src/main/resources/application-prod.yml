server:
  port: 8080

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # 💡 나중에 AWS RDS(PostgreSQL) 등을 연결할 때 사용할 URL
    url: jdbc:postgresql://${PROD_DB_URL}:5432/${PROD_DB_NAME}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 🚨 중요: 실제 서비스(운영) DB는 절대 update를 쓰면 안 됩니다!
      # validate(검증만) 또는 none을 쓰고, 테이블은 직접 SQL 쿼리로 만들어야 안전합니다.
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}